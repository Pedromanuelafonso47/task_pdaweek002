# Infraestrutura completa (alternativa ao PostgreSQL embutido)
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: agrogenius
      POSTGRES_DB: agrogenius
    ports: ["54329:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./infra/mosquitto:/mosquitto/config"]
volumes:
  dbdata:
